<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="Star schema in Power BI with three facts that keep their own grain and share three dimensions. Daily Price (1,018 rows, one competitor price of our product per listing per day), Price Change (127 rows, one per price change) and Price Gap (824 rows, each listing's latest price against ours) join Product (360 rows) on sku and Store (11 rows) on store_id, many to one. Daily Price and Price Change also join Date (808 days) on observed_on; Price Gap has no date, it is where we stand now.">
