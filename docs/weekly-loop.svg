<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="The weekly loop: once a week the run reads competitor pages, matches them to our products, stores every price with its date, and alerts on an undercut. Right: one product at one competitor over seven weeks; a first cut stays above our price and is only stored, a second cut goes below our price and fires the alert, then the price goes back up.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16233B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .num { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .step { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .desc { font-size: 12.5px; fill: #94A3B8; }
    .hint { font-size: 12.5px; fill: #F59E0B; font-weight: 600; }
    .axis { font-size: 11.5px; fill: #64748B; }
    .loop { fill: none; stroke: #F59E0B; stroke-opacity: 0.6; stroke-width: 2; stroke-dasharray: 3 9; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .ring { fill: none; stroke: #F59E0B; stroke-width: 2; animation: pulse 2s ease-out infinite; transform-origin: 820px 280px; }
    @keyframes pulse { from { transform: scale(0.6); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
  </style>

  <rect width="1000" height="440" rx="22" fill="url(#bg)"/>
  <text x="40" y="52" class="title">The weekly loop</text>
  <text x="40" y="76" class="sub">Once a week the run goes round the loop. Prices are only ever added, so every change can be found.</text>

  <!-- The loop -->
  <circle cx="300" cy="250" r="120" class="loop"/>
  <g fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-6 -7 L6 0 L-6 7" transform="translate(384.9 165.1) rotate(45)"/>
    <path d="M-6 -7 L6 0 L-6 7" transform="translate(384.9 334.9) rotate(135)"/>
    <path d="M-6 -7 L6 0 L-6 7" transform="translate(215.1 334.9) rotate(225)"/>
    <path d="M-6 -7 L6 0 L-6 7" transform="translate(215.1 165.1) rotate(315)"/>
  </g>
  <text x="300" y="245" class="step" text-anchor="middle">every</text>
  <text x="300" y="265" class="step" text-anchor="middle">Sunday</text>

  <g fill="#0B1220" stroke="#F59E0B" stroke-width="2">
    <circle cx="300" cy="130" r="24"/>
    <circle cx="420" cy="250" r="24"/>
    <circle cx="300" cy="370" r="24"/>
    <circle cx="180" cy="250" r="24"/>
  </g>
  <text x="300" y="135" class="num" text-anchor="middle">1</text>
  <text x="420" y="255" class="num" text-anchor="middle">2</text>
  <text x="300" y="375" class="num" text-anchor="middle">3</text>
  <text x="180" y="255" class="num" text-anchor="middle">4</text>

  <text x="336" y="124" class="step">Read</text>
  <text x="336" y="142" class="desc">competitor prices</text>
  <text x="456" y="245" class="step">Match</text>
  <text x="456" y="263" class="desc">to our products</text>
  <text x="336" y="366" class="step">Store</text>
  <text x="336" y="384" class="desc">every price, dated</text>
  <text x="144" y="245" class="step" text-anchor="end">Alert</text>
  <text x="144" y="263" class="desc" text-anchor="end">on undercut</text>

  <!-- One listing's history -->
  <rect x="560" y="105" width="400" height="300" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#334155"/>
  <text x="580" y="135" class="step">One product at one competitor</text>
  <text x="580" y="154" class="desc">each dot is a price the weekly run stored</text>

  <line x1="595" y1="250" x2="935" y2="250" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="597" y="243" class="desc">our price</text>

  <path d="M600 215 H710 V230 H820 V280 H930 V215" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <g fill="#CBD5E1">
    <circle cx="600" cy="215" r="4"/>
    <circle cx="655" cy="215" r="4"/>
    <circle cx="765" cy="230" r="4"/>
    <circle cx="875" cy="280" r="4"/>
  </g>
  <g fill="#0B1220" stroke="#FFFFFF" stroke-width="2">
    <circle cx="710" cy="230" r="6"/>
    <circle cx="930" cy="215" r="6"/>
  </g>
  <circle cx="820" cy="280" r="9" class="ring"/>
  <circle cx="820" cy="280" r="7" fill="#F59E0B"/>

  <text x="710" y="188" class="desc" text-anchor="middle">cut, still above ours:</text>
  <text x="710" y="204" class="desc" text-anchor="middle">stored</text>
  <text x="820" y="306" class="hint" text-anchor="middle">cut below ours: alert</text>
  <text x="930" y="196" class="desc" text-anchor="end">back up</text>

  <line x1="595" y1="322" x2="935" y2="322" stroke="#334155"/>
  <g class="axis" text-anchor="middle">
    <text x="600" y="340">wk 1</text>
    <text x="655" y="340">wk 2</text>
    <text x="710" y="340">wk 3</text>
    <text x="765" y="340">wk 4</text>
    <text x="820" y="340">wk 5</text>
    <text x="875" y="340">wk 6</text>
    <text x="930" y="340">wk 7</text>
  </g>
  <text x="580" y="370" class="desc">A change is a price that differs from the one before it</text>
  <text x="580" y="388" class="desc">(a SQL window function over the history).</text>
</svg>
