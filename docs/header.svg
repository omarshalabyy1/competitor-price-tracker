<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Competitor price tracker. Every competitor price change on 356 products, caught every week: 10 stores, 127 changes caught, each within one run, 17 undercuts on key products.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .pill { font-size: 14px; font-weight: 600; fill: #E2E8F0; }
    .wave { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -120; } }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 900px 100px; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.08); opacity: 1; } }
  </style>

  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="880" cy="70" r="190" fill="url(#glowA)"/>
  <circle cx="160" cy="280" r="170" fill="url(#glowB)"/>

  <path class="wave" stroke="#2DD4BF" stroke-opacity="0.55" d="M0 262 C 150 228, 300 298, 480 262 S 780 234, 1000 258"/>
  <path class="wave" stroke="#A78BFA" stroke-opacity="0.45" style="animation-duration:9s" d="M0 282 C 180 256, 330 304, 520 278 S 820 254, 1000 276"/>

  <!-- Title -->
  <text x="50" y="118" class="sans" font-size="46" font-weight="700" fill="#FFFFFF">Competitor price tracker</text>
  <text x="52" y="156" class="sans" font-size="20" font-weight="600" fill="#5EEAD4">Every competitor price change on 356 products, caught every week.</text>

  <!-- Key numbers -->
  <g class="sans">
    <rect x="52" y="182" width="92" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#334155"/>
    <text x="98" y="204" class="pill" text-anchor="middle">10 stores</text>
    <rect x="154" y="182" width="170" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#334155"/>
    <text x="239" y="204" class="pill" text-anchor="middle">127 changes caught</text>
    <rect x="334" y="182" width="164" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#334155"/>
    <text x="416" y="204" class="pill" text-anchor="middle">each within one run</text>
    <rect x="508" y="182" width="124" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#334155"/>
    <text x="570" y="204" class="pill" text-anchor="middle">17 undercuts</text>
  </g>

  <!-- Network mark -->
  <g class="pulse" stroke="#5EEAD4" stroke-opacity="0.8" stroke-width="1.6">
    <line x1="900" y1="100" x2="868" y2="72"/>
    <line x1="900" y1="100" x2="932" y2="72"/>
    <line x1="900" y1="100" x2="868" y2="128"/>
    <line x1="900" y1="100" x2="932" y2="128"/>
    <circle cx="900" cy="100" r="15" fill="#1E3A5F"/>
    <circle cx="868" cy="72" r="7" fill="#0F172A"/>
    <circle cx="932" cy="72" r="7" fill="#0F172A"/>
    <circle cx="868" cy="128" r="7" fill="#0F172A"/>
    <circle cx="932" cy="128" r="7" fill="#0F172A"/>
  </g>
</svg>
