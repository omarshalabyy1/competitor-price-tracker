<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Competitor price tracker. Every competitor price change on 356 products, caught every week: 10 stores, 127 changes caught, each within one run, 17 undercuts on key products. A price tag cut from 4.00 to 3.00, below our 4.29, caught that week.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16233B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
      <radialGradient id="jrGlowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jrGlowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 40px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 18px; fill: #CBD5E1; }
    .pill { font-size: 14px; font-weight: 600; fill: #E2E8F0; }
    .old { font-size: 26px; font-weight: 700; fill: #94A3B8; }
    .new { font-size: 26px; font-weight: 700; fill: #0B1220; }
    .note { font-size: 13px; fill: #94A3B8; }
    .move { fill: none; stroke: #F59E0B; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
      .wave { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -120; } }
  </style>

  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="880" cy="60" r="190" fill="url(#jrGlowA)"/>
  <circle cx="160" cy="280" r="170" fill="url(#jrGlowB)"/>
  <path class="wave" stroke="#2DD4BF" stroke-opacity="0.5" d="M24 289 C 200 284, 330 293, 500 289 S 800 285, 976 289"/>
  <path class="wave" stroke="#A78BFA" stroke-opacity="0.4" style="animation-duration:9s" d="M40 295 C 220 291, 360 298, 520 295 S 820 292, 960 295"/>

  <circle cx="820" cy="170" r="190" fill="url(#glow)"/>

  <text x="50" y="108" class="title">Competitor price tracker</text>
  <text x="50" y="146" class="sub">Every competitor price change on 356 products, caught every week.</text>

  <g>
    <rect x="50" y="182" width="92" height="34" rx="17" fill="none" stroke="#334155"/>
    <text x="96" y="204" class="pill" text-anchor="middle">10 stores</text>
    <rect x="152" y="182" width="170" height="34" rx="17" fill="none" stroke="#334155"/>
    <text x="237" y="204" class="pill" text-anchor="middle">127 changes caught</text>
    <rect x="332" y="182" width="164" height="34" rx="17" fill="none" stroke="#334155"/>
    <text x="414" y="204" class="pill" text-anchor="middle">each within one run</text>
    <rect x="506" y="182" width="124" height="34" rx="17" fill="none" stroke="#F59E0B"/>
    <text x="568" y="204" class="pill" text-anchor="middle" fill="#F59E0B" style="fill:#F59E0B">17 undercuts</text>
  </g>

  <!-- A real cut: 4.00 to 3.00, below our 4.29 -->
  <path d="M722 62 H860 V122 H722 L700 92 Z" fill="#FFFFFF" fill-opacity="0.05" stroke="#64748B" stroke-width="2"/>
  <circle cx="718" cy="92" r="5" fill="none" stroke="#64748B" stroke-width="2"/>
  <text x="793" y="101" class="old" text-anchor="middle">4.00</text>
  <line x1="758" y1="92" x2="828" y2="92" stroke="#94A3B8" stroke-width="2.5"/>

  <path class="move" d="M870 104 C 930 130, 930 160, 900 180"/>

  <path d="M792 160 H930 V220 H792 L770 190 Z" fill="#F59E0B"/>
  <circle cx="788" cy="190" r="5" fill="#0B1220"/>
  <text x="863" y="199" class="new" text-anchor="middle">3.00</text>

  <text x="700" y="256" class="note">A key product, ours at 4.29: the cut was</text>
  <text x="700" y="274" class="note">caught by that week's run.</text>
</svg>
