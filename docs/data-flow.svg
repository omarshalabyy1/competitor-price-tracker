<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 728" width="1000" height="728" role="img" aria-label="Data flow, table by table: our catalogue.csv loads the table product (360 rows) and the competitors in config/client.yaml load store (11 rows). Each weekly run reads the Open Prices API for 9 grocery stores and the pages of 2 web shops into listing and price_observation, a history that is never updated or deleted. The match step sets each listing's product, by barcode or by name. The view daily_price keeps one price per listing per day; the views price_change (127 rows), price_gap (824 rows) and undercut (17 rows) compare those prices with ours. Power BI reads them into two pages, the notebook computes every README number, and send_alert emails the undercuts and records each email in alert_sent. Airflow runs load_reference, the two collect tasks, match and send_alert every week.">
